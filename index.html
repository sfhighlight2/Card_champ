  <!DOCTYPE html>
  <html lang="en">
    <head>

      <meta charset="UTF-8" />
      <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
           values; without it those insets are always 0 and fixed bars end up
           underneath the home indicator and the browser toolbar. -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Card Champs</title>
      <meta name="description" content="Scan and catalog trading cards by selecting year, brand, and team with intuitive pickers, then display them in an organized grid for easy collection management." />
      <meta name="robots" content="noindex, nofollow" />
      <link rel="manifest" href="/manifest.json" />
      <link rel="icon" href="/icons/icon-192.png" />
      <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
      <meta name="theme-color" content="#111f3b" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="Card Champs" />
      <style>
        /* The page scrolls; screens grow with their content. Fixed dvh heights
           here caused two kinds of jank: screens without their own scroll area
           (the sign-up form) were clipped with no way to reach the fields below
           the fold, and the layout reflowed every time the browser toolbar
           collapsed or expanded mid-scroll. Minimum heights let short screens
           still fill the viewport without either problem. */
        html, body { margin: 0; }
        html { overflow-x: hidden; }
        body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
        #root { min-height: 100vh; min-height: 100dvh; }
      </style>

    </head>

    <body>

      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>

    </body>
  </html>
